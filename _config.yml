###########################################################
# Google Research Blog-inspired Configuration
# Clean, minimal, and professional design
###########################################################

############################
# --- Required options --- #
############################

# Name of website
title: AXA Research

###############################################
# --- Navigation bar links --- #
###############################################

navbar-links:
  Home: ""
  Research: "research"
  Publications!!!: "publications"
  Our Team: "ourteam"

################
# --- Logo --- #
################

# Remove avatar and use text title only (like Google Research)
round-avatar: false
title-img: "/assets/img/axa-logo.png"  # Add your AXA logo here

#####################################
# --- Footer options --- #
#####################################

# Minimal footer with only essential links
social-network-links:
  rss: true
  github: "axa-go-getd"  # Update with your team's GitHub
  linkedin: "company/axa"  # Update with AXA's LinkedIn

# RSS feed description
rss-description: "Latest research from AXA's AI Advanced Modeling team"

###########################
# --- General options --- #
###########################

# Google Research-style settings
title-on-all-pages: false  # Only show title on homepage
excerpt_length: 30  # Shorter excerpts
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: false  # Disable edit button for cleaner look

#################################
# --- Visual customization --- #
#################################

# Google Research-inspired color scheme
page-col: "#FFFFFF"  # Pure white background
text-col: "#3c4043"  # Google's dark gray text
link-col: "#1a73e8"  # Google's blue
hover-col: "#174ea6"  # Darker blue for hover
navbar-col: "#FFFFFF"  # White navbar
navbar-text-col: "#3c4043"  # Dark gray navbar text
navbar-border-col: "#e0e0e0"  # Light border
footer-col: "#FFFFFF"  # White footer
footer-text-col: "#5f6368"  # Medium gray footer text
footer-link-col: "#1a73e8"  # Blue footer links

# Remove all decorative elements
navbar-var-length: true  # Allow long menu items
share-links-active:  # Disable all social sharing
  twitter: false
  facebook: false
  linkedin: false

# Font settings (will need to add Google Fonts in head.html)
site-css:
  - "/assets/css/custom-styles.css"  # For additional styling

####################
# --- Comments --- #
####################

# Disable comments for cleaner look
comments: false

################
# --- Misc --- #
################

# Clean date format
date_format: "%B %d, %Y"

# Exclude unnecessary files
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/


